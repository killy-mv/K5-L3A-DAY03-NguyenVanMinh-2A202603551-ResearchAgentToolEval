# starter_v0 — tool declarations.
# Keep routing guidance and argument conventions aligned with system_prompt.md.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi một câu ngắn khi thiếu thông tin bắt buộc. Dùng response_type=text để xin thông tin; dùng yes_no để lấy xác nhận trước khi gửi. Không dùng để hỏi lại dữ liệu đã có."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "text để xin dữ liệu còn thiếu; yes_no để xác nhận hành động"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Lấy bài đăng gần đây của một tài khoản cụ thể. Dùng cho bài CỦA một người; không dùng để tìm bài theo chủ đề. screenname là handle không có @ (ví dụ elonmusk, sama, karpathy)."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Handle tài khoản, bỏ ký tự @; ánh xạ tên chắc chắn sang handle nếu biết"}
        limit: {type: integer, default: 5, description: "Số bài cần lấy; giữ nguyên số user yêu cầu"}
      required: [screenname]

  - name: social_search
    description: "Tìm bài đăng theo chủ đề hoặc từ khóa trên mạng xã hội. Dùng cho thảo luận về một chủ đề, không dùng cho timeline của một tài khoản cụ thể."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Chủ đề cốt lõi, ví dụ AI; không thêm Twitter/news/today nếu không cần"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Latest cho bài mới; Top cho bài phổ biến"}
        limit: {type: integer, default: 5, description: "Số bài cần lấy; giữ nguyên số user yêu cầu"}
      required: [query]

  - name: lookup
    description: "Tìm thông tin trên web. Dùng cho thông tin web/tin tức, không dùng cho bài đăng mạng xã hội hoặc câu hỏi toán/lập trình ngoài phạm vi research."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Chủ đề cốt lõi; ví dụ tin AI hôm nay -> AI. Không thêm news/today khi topic và timeframe đã thể hiện ý đó."}
        topic: {type: string, enum: [general, news], default: "general", description: "news cho tin thời sự; general cho tra cứu web thông thường"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian; dùng day cho hôm nay, week cho tuần này"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Lấy nội dung từ một địa chỉ."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi nội dung lên Telegram. Nếu user chưa xác nhận, trước tiên dùng clarify với response_type=yes_no (kể cả khi nội dung còn thiếu); sau khi xác nhận, hỏi nội dung còn thiếu rồi chỉ gọi send với confirmed=true."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "true chỉ sau khi user xác nhận rõ ràng; nếu chưa, không gọi send"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]
